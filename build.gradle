plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.2.2'
}

group = 'org.nekodancer'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    maven {
        url = uri('https://jitpack.io')
    }
}

dependencies {
    // PS Framework
    implementation('com.github.NoFileFound:PSFramework:1.0.2')
    implementation('io.netty:netty-all:4.1.130.Final')

    // Database
    implementation('dev.morphia.morphia:morphia-core:2.4.14')

    // Lua
    implementation("org.luaj:luaj-jse:3.0.1")
}

shadowJar {
    archiveClassifier.set('')
    manifest {
        attributes('Main-Class': 'org.nekodancer.Application')
    }
}

test {
    useJUnitPlatform()
}